[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcommon"
version = "1.0.0"
description = "Utilidades comunes Warehouse Cloud Platform: logging JSON, correlation id, eventos, RabbitMQ con retry/DLQ, idempotencia"
requires-python = ">=3.10"
dependencies = [
  "pika>=1.3,<2",
  "prometheus-client>=0.20",
  "SQLAlchemy>=2.0",
  "starlette>=0.36",
]

[tool.setuptools]
packages = ["wcommon"]
