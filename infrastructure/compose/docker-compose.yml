    "rabbitmq": {
      "image": "rabbitmq:3.13-management",
      "ports": [
        "5672:5672",
        "15672:15672",
        "15692:15692"
      ],
      "environment": {
        "RABBITMQ_DEFAULT_USER": "guest",
        "RABBITMQ_DEFAULT_PASS": "guest"
      },
      "volumes": [
        "rabbitmq-data:/var/lib/rabbitmq"
      ],
      "healthcheck": {
