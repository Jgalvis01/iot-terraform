{
  "services": {
    "wh-001-db": {
      "image": "postgres:15-alpine",
      "environment": {
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "postgres",
        "POSTGRES_DB": "warehouse_db"
      },
      "volumes": [
        "wh-001-db-data:/var/lib/postgresql/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 10
      },
      "ports": [
        "5401:5432"
      ]
    },
    "wh-001-redis": {
      "image": "redis:7-alpine",
      "command": [
        "redis-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru"
      ],
      "ports": [
        "6301:6379"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "redis-cli",
          "ping"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 10
      }
    },
    "wh-001-api": {
      "build": {
        "context": "../..",
        "dockerfile": "services/warehouse-api/Dockerfile"
      },
      "image": "warehouse-api:local",
      "environment": {
        "SERVICE_NAME": "warehouse-api-wh-001",
        "WAREHOUSE_ID": "WH-001",
        "DATABASE_URL": "postgresql://postgres:postgres@wh-001-db:5432/warehouse_db",
        "REDIS_URL": "redis://wh-001-redis:6379/0",
        "CACHE_ENABLED": "${CACHE_ENABLED:-true}",
        "CACHE_TTL_SECONDS": "30",
        "RABBITMQ_URL": "amqp://guest:guest@rabbitmq:5672/%2F",
        "EVENTS_ENABLED": "${EVENTS_ENABLED:-false}"
      },
      "depends_on": {
        "wh-001-db": {
          "condition": "service_healthy"
        },
        "wh-001-redis": {
          "condition": "service_started"
        }
      },
      "restart": "unless-stopped",
      "ports": [
        "8001:8000"
      ]
    },
    "wh-001-outbox": {
      "image": "warehouse-api:local",
      "command": [
        "python",
        "-m",
        "app.outbox_relay"
      ],
      "environment": {
        "SERVICE_NAME": "outbox-relay-wh-001",
        "WAREHOUSE_ID": "WH-001",
        "DATABASE_URL": "postgresql://postgres:postgres@wh-001-db:5432/warehouse_db",
        "REDIS_URL": "redis://wh-001-redis:6379/0",
        "CACHE_ENABLED": "${CACHE_ENABLED:-true}",
        "CACHE_TTL_SECONDS": "30",
        "RABBITMQ_URL": "amqp://guest:guest@rabbitmq:5672/%2F",
        "EVENTS_ENABLED": "true"
      },
      "depends_on": {
        "wh-001-db": {
          "condition": "service_healthy"
        },
        "rabbitmq": {
          "condition": "service_healthy"
        },
        "wh-001-api": {
          "condition": "service_started"
        }
      },
      "healthcheck": {
        "disable": true
      },
      "profiles": [
        "events"
      ],
      "restart": "unless-stopped"
    },
    "wh-001-cache-worker": {
      "image": "workers:local",
      "command": [
        "python",
        "-m",
        "workers.cache"
      ],
      "environment": {
        "SERVICE_NAME": "cache-worker-wh-001",
        "WAREHOUSE_ID": "WH-001",
        "REDIS_URL": "redis://wh-001-redis:6379/0",
        "RABBITMQ_URL": "amqp://guest:guest@rabbitmq:5672/%2F"
      },
      "depends_on": {
        "rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "profiles": [
        "events"
      ],
      "restart": "unless-stopped"
    },
    "redis-exporter-wh-001": {
      "image": "oliver006/redis_exporter:v1.62.0",
      "environment": {
        "REDIS_ADDR": "redis://wh-001-redis:6379"
      },
      "profiles": [
        "obs"
      ]
    },
    "postgres-exporter-wh-001": {
      "image": "quay.io/prometheuscommunity/postgres-exporter:v0.15.0",
      "environment": {
        "DATA_SOURCE_NAME": "postgresql://postgres:postgres@wh-001-db:5432/warehouse_db?sslmode=disable"
      },
      "profiles": [
        "obs"
      ]
    },
