upstream wh002_api {
    zone wh002_api 64k;
    server wh-002-api-1:8000 max_fails=2 fail_timeout=10s;
    server wh-002-api-2:8000 max_fails=2 fail_timeout=10s;
    server wh-002-api-3:8000 max_fails=2 fail_timeout=10s;
}

log_format upstreamlog '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time cid=$http_x_correlation_id';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstreamlog;

    location / {
        proxy_pass http://wh002_api;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        add_header X-Upstream $upstream_addr always;
    }

    location = /lb-health { return 200 "ok\n"; }
}
